<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DEAD RUSH 3D</title>
<style>
  :root{--red:#c4161c;--amber:#ffb23e;--ink:#d9e0d6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Arial Narrow","Franklin Gothic Medium",Impact,system-ui,sans-serif;color:var(--ink)}
  #game{position:fixed;inset:0}
  #game canvas{display:block;width:100%;height:100%}
  .ov{position:fixed;inset:0;pointer-events:none}
  #vig{background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.88) 100%)}
  #dmg{background:radial-gradient(ellipse at center,transparent 35%,rgba(190,0,0,.75) 100%);opacity:0;transition:opacity .35s}
  #low{background:radial-gradient(ellipse at center,transparent 50%,rgba(120,0,0,.55) 100%);opacity:0;transition:opacity .6s}
  #low.on{opacity:1;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.45}}
  #bolt{background:#cfe0ff;opacity:0}
  #grain{opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");animation:gr .5s steps(4) infinite}
  @keyframes gr{0%{transform:translate(0,0)}25%{transform:translate(-30px,20px)}50%{transform:translate(25px,-35px)}75%{transform:translate(-15px,-10px)}}
  #hud{position:fixed;inset:0;pointer-events:none;display:none;text-shadow:0 2px 4px #000}
  #hpwrap{position:absolute;left:18px;top:16px;width:min(260px,40vw)}
  #hpbar{height:16px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);transform:skewX(-14deg);overflow:hidden}
  #hpfill{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8a0f14,#d9232a);transition:width .15s}
  #hptxt{font-size:13px;letter-spacing:2px;opacity:.8}
  #mission{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center}
  #mnum{display:block;color:var(--amber);font-size:20px;letter-spacing:5px}
  #mtxt{font-size:16px;letter-spacing:2px}
  #score{position:absolute;right:18px;top:12px;text-align:right}
  #sc{font-size:26px;letter-spacing:2px}
  #cmb{display:block;color:#ff7a2e;font-size:17px;letter-spacing:2px;min-height:20px}
  #ammo{position:absolute;right:20px;bottom:20px;text-align:right}
  #am{font-size:54px;line-height:1;letter-spacing:2px}
  #ar{font-size:26px;opacity:.8;margin-left:6px}
  #wname{display:block;font-size:12px;letter-spacing:4px;opacity:.6;margin-top:2px}
  #ammo.low #am{color:#ff3b3b}
  #ammo.none #am{animation:blink .5s infinite}
  @keyframes blink{50%{opacity:.2}}
  #cross{position:absolute;left:50%;top:50%;width:0;height:0}
  #cross i{position:absolute;background:#fff;opacity:.85;box-shadow:0 0 3px #000}
  #cross i:nth-child(1){width:2px;height:9px;left:-1px;top:-17px}
  #cross i:nth-child(2){width:2px;height:9px;left:-1px;top:8px}
  #cross i:nth-child(3){height:2px;width:9px;top:-1px;left:-17px}
  #cross i:nth-child(4){height:2px;width:9px;top:-1px;left:8px}
  #cross.hit i{background:#ff2a2a}
  #cross.kill i{background:#ff2a2a;transform:scale(1.8)}
  #loc{position:absolute;left:50%;top:78px;transform:translateX(-50%);text-align:center;display:none}
  #arrow{width:0;height:0;margin:0 auto;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:22px solid var(--amber);filter:drop-shadow(0 0 6px #ffb23e)}
  #ldist{font-size:13px;letter-spacing:3px;color:var(--amber)}
  #toast{position:absolute;left:50%;top:68%;transform:translateX(-50%);font-size:20px;letter-spacing:4px;opacity:0;transition:opacity .25s;white-space:nowrap}
  #toast.show{opacity:1}
  #big{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-size:clamp(30px,6vw,64px);letter-spacing:10px;opacity:0;transition:opacity .4s;text-align:center;color:#e8e8e0;white-space:nowrap}
  #big small{display:block;font-size:.3em;letter-spacing:6px;color:var(--amber)}
  #big.show{opacity:1}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.55);padding:20px}
  .screen h1{margin:0;font-size:clamp(48px,11vw,120px);letter-spacing:12px;color:#d01a20;text-shadow:0 0 30px rgba(208,26,32,.6),0 4px 0 #300;font-family:Impact,"Arial Narrow",sans-serif;font-weight:400}
  .screen h2{margin:4px 0 18px;font-size:clamp(14px,2.4vw,22px);letter-spacing:12px;font-weight:400;color:#9aa398}
  .screen p{max-width:560px;margin:6px 0;color:#aeb6aa;letter-spacing:1px;line-height:1.5}
  .screen button,.card{font-family:inherit;cursor:pointer}
  .screen button{margin-top:22px;padding:14px 38px;font-size:22px;letter-spacing:6px;color:#fff;background:#8a0f14;border:2px solid #d9232a;transform:skewX(-10deg);transition:.15s}
  .screen button:hover{background:#c4161c;box-shadow:0 0 24px rgba(217,35,42,.7)}
  .help{margin-top:22px;font-size:13px;letter-spacing:2px;color:#7f887c;line-height:1.9}
  .help b{color:#cfd6cb}
  .cards{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap;justify-content:center}
  .card{width:min(220px,28vw);min-width:150px;padding:18px 12px;background:rgba(15,22,16,.9);border:2px solid #4c7a3a;color:#fff;transition:.15s}
  .card:hover{border-color:#ffb23e;transform:translateY(-4px)}
  .card .k{font-size:40px;color:#7ac14e}
  .card .n{font-size:18px;letter-spacing:3px;margin:6px 0}
  .card .d{font-size:14px;color:#b9c3b4;letter-spacing:1px}
  #err{position:fixed;inset:0;background:#000;color:#f66;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:50;font-size:18px;letter-spacing:1px}
  /* touch controls */
  #touch{position:fixed;inset:0;display:none}
  #tz{position:absolute;inset:0}
  #joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.07);display:none}
  #stick{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.35)}
  .tb{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:2px}
  .tb:active{background:rgba(220,40,40,.5)}
  #bF{right:22px;bottom:110px;width:92px;height:92px;background:rgba(200,30,30,.28)}
  #bR{right:128px;bottom:96px;width:64px;height:64px}
  #bM{right:30px;bottom:216px;width:60px;height:60px}
  #bP{left:16px;top:70px;width:44px;height:44px;font-size:16px}
</style>
</head>
<body>
<div id="game"></div>
<div class="ov" id="vig"></div>
<div class="ov" id="low"></div>
<div class="ov" id="dmg"></div>
<div class="ov" id="bolt"></div>
<div class="ov" id="grain"></div>

<div id="hud">
  <div id="hpwrap"><div id="hpbar"><i id="hpfill"></i></div><span id="hptxt"></span></div>
  <div id="mission"><b id="mnum"></b><span id="mtxt"></span></div>
  <div id="score"><span id="sc"></span><b id="cmb"></b></div>
  <div id="ammo"><span id="am"></span><span id="ar"></span><small id="wname">M4 CARBINE</small></div>
  <div id="cross"><i></i><i></i><i></i><i></i></div>
  <div id="loc"><div id="arrow"></div><span id="ldist"></span></div>
  <div id="toast"></div>
  <div id="big"></div>
</div>

<div id="touch">
  <div id="tz"></div>
  <div id="joy"><div id="stick"></div></div>
  <div class="tb" id="bF">FIRE</div>
  <div class="tb" id="bR">RELOAD</div>
  <div class="tb" id="bM">KNIFE</div>
  <div class="tb" id="bP">II</div>
</div>

<div class="screen" id="screen"></div>
<div id="err">Could not load the 3D engine (three.js).<br>Please check your internet connection and reload the page.</div>

<script type="module">

flash.target.position.set(0, 0, -10);

const muzzleLight = new THREE.PointLight(0xffa844, 0, 9, 0);

// ---------------------------------------------------------------- helpers: geometry cache & materials

function part(parent, geo, m, x = 0, y = 0, z = 0, shadow = true) {
  const me = new THREE.Mesh(geo, m);
  me.position.set(x, y, z); me.castShadow = shadow; me.receiveShadow = true;
  parent.add(me); return me;
}
function pivot(parent, x, y, z) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }

// ---------------------------------------------------------------- world: ground, sky, props
function groundTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#1b1d19'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 3000; i++) { const v = 18 + Math.random() * 34 | 0; g.fillStyle = `rgb(${v},${v + 3},${v - 3})`; g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); }
  g.strokeStyle = '#0b0c0a'; g.lineWidth = 1.2;
  for (let i = 0; i < 9; i++) { g.beginPath(); let x = Math.random() * 256, y = Math.random() * 256; g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += rand(-24, 24); y += rand(-24, 24); g.lineTo(x, y); } g.stroke(); }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(26, 26);
  if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace;

}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), new THREE.MeshStandardMaterial({ map: groundTexture(), roughness: 0.95, color: 0xb0b0b0 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// asphalt road strip with worn lane marks
const road = new THREE.Mesh(new THREE.PlaneGeometry(9, 220), mat(0x0f1011, { roughness: 0.7 }));
road.rotation.x = -Math.PI / 2; road.position.y = 0.015; road.receiveShadow = true; scene.add(road);
for (let i = -20; i < 20; i++) {
  const m = new THREE.Mesh(BX(0.2, 0.02, 2), mat(0x6b6232));
  m.position.set(0, 0.03, i * 5.4); scene.add(m);
}
// blood stains
for (let i = 0; i < 16; i++) {
  const s = new THREE.Mesh(new THREE.CircleGeometry(rand(0.5, 1.6), 14), new THREE.MeshBasicMaterial({ color: 0x300606, transparent: true, opacity: 0.85 }));
  s.rotation.x = -Math.PI / 2; s.position.set(rand(-36, 36), 0.025, rand(-36, 36)); scene.add(s);
}
// moon + stars
const moon = new THREE.Mesh(SP(7, 20, 14), new THREE.MeshBasicMaterial({ color: 0xdfe7ff, fog: false }));
moon.position.set(-90, 85, -110); scene.add(moon);
{
  const n = 700, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, e = Math.random() * 1.3 + 0.1, r = 170;
    arr[i * 3] = Math.cos(a) * Math.cos(e) * r; arr[i * 3 + 1] = Math.sin(e) * r * 0.9; arr[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xcdd6f5, size: 1.4, sizeAttenuation: false, fog: false })));
}

const props = [];   // circle colliders {x,z,r,h}
const flickers = []; // {light, base}
function addProp(obj, x, z, r, h, ry = 0) {
  obj.position.set(x, 0, z); obj.rotation.y = ry; scene.add(obj);
  props.push({ x, z, r, h });
}
function freeSpot(minR, maxR, clearance) {
  for (let k = 0; k < 40; k++) {
    const a = RS() * Math.PI * 2, d = minR + RS() * (maxR - minR);
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (Math.abs(x) < 6 && z > -6 && z < 14) continue;      // keep the road/start clear
    if (props.every(p => Math.hypot(p.x - x, p.z - z) > clearance + p.r)) return { x, z };
  }

}
const M_CRATE = mat(0x5b4426), M_CRATE2 = mat(0x3d2c18), M_BARREL = mat(0x2c4a3a, { metalness: 0.4, roughness: 0.55 }), M_RUST = mat(0x6a3a22, { metalness: 0.3, roughness: 0.7 });
const M_CONC = mat(0x55575a, { roughness: 0.95 }), M_BARK = mat(0x15110e), M_CAR = [mat(0x3a1a1a, { metalness: 0.5, roughness: 0.4 }), mat(0x1f2d3a, { metalness: 0.5, roughness: 0.4 }), mat(0x3b3b32, { metalness: 0.5, roughness: 0.4 })];
const M_GLASS = mat(0x0a0f14, { metalness: 0.8, roughness: 0.2 });

for (let i = 0; i < 9; i++) { const g = new THREE.Group(); const s = 1.2 + RS() * 0.5; part(g, BX(s, s, s), i % 2 ? M_CRATE : M_CRATE2, 0, s / 2, 0); if (RS() < 0.4) part(g, BX(s * 0.7, s * 0.7, s * 0.7), M_CRATE, 0.1, s + s * 0.35, 0.05); const p = freeSpot(8, 34, 3); addProp(g, p.x, p.z, s * 0.75, s * 1.6, RS() * 3); }
for (let i = 0; i < 6; i++) { const g = new THREE.Group(); part(g, CY(0.5, 0.5, 1.15, 12), i % 3 ? M_BARREL : M_RUST, 0, 0.575, 0); const p = freeSpot(7, 35, 2.5); addProp(g, p.x, p.z, 0.55, 1.15); }
for (let i = 0; i < 4; i++) {
  const g = new THREE.Group(); const cm = M_CAR[i % 3];
  part(g, BX(1.9, 0.8, 4.4), cm, 0, 0.7, 0); part(g, BX(1.7, 0.7, 2.3), M_GLASS, 0, 1.4, -0.2);

  part(g, CY(0.38, 0.38, 0.3, 10), mat(0x050505), 0.95, 0.38, 1.4).rotation.z = Math.PI / 2;
  part(g, CY(0.38, 0.38, 0.3, 10), mat(0x050505), -0.95, 0.38, -1.4).rotation.z = Math.PI / 2;
  part(g, CY(0.38, 0.38, 0.3, 10), mat(0x050505), 0.95, 0.38, -1.4).rotation.z = Math.PI / 2;

for (let i = 0; i < 7; i++) {
  const g = new THREE.Group(); const h = 4 + RS() * 3;
  part(g, CY(0.12, 0.28, h, 7), M_BARK, 0, h / 2, 0);
  for (let k = 0; k < 4; k++) { const b = part(g, CY(0.03, 0.09, 2 + RS() * 1.5, 5), M_BARK, 0, h * (0.55 + RS() * 0.4), 0); b.rotation.z = (RS() - 0.5) * 2.2; b.rotation.y = RS() * 6.28; b.position.x = Math.sin(b.rotation.y) * 0.4; }
  const p = freeSpot(9, 37, 3); addProp(g, p.x, p.z, 0.4, h);
}
for (let i = 0; i < 7; i++) { const g = new THREE.Group(); part(g, BX(3, 1, 0.7), M_CONC, 0, 0.5, 0); const p = freeSpot(8, 34, 3); addProp(g, p.x, p.z, 1.4, 1, RS() * 3.1); }
// lamp posts (flickering) + a burning barrel
[[-6, -12], [7, -24], [-8, 14], [9, 26]].forEach(([x, z]) => {
  const g = new THREE.Group();
  part(g, CY(0.07, 0.1, 5, 6), mat(0x1c1c1c), 0, 2.5, 0);
  part(g, BX(0.9, 0.12, 0.35), mat(0xffe0a0, { emissive: 0xffc070, emissiveIntensity: 1.6 }), 0, 5.05, 0.2, false);
  addProp(g, x, z, 0.3, 5);
  const L = new THREE.PointLight(0xffd9a0, 3, 16, 0); L.position.set(x, 4.8, z + 0.2); scene.add(L);
  flickers.push({ light: L, base: 3, t: rand(0, 9), broken: RS() < 0.4 });
});
{
  const g = new THREE.Group(); part(g, CY(0.5, 0.5, 1.15, 12), M_RUST, 0, 0.575, 0);
  part(g, SP(0.35, 8, 6), mat(0xff6a1a, { emissive: 0xff5500, emissiveIntensity: 2.4 }), 0, 1.2, 0, false);
  addProp(g, 5, -7, 0.55, 1.2);
  const L = new THREE.PointLight(0xff7a2a, 4, 14, 0); L.position.set(5, 1.8, -7); scene.add(L);
  flickers.push({ light: L, base: 4, t: 3, broken: false, fire: true });
}
// broken perimeter fence
for (let i = 0; i < 56; i++) {
  if (RS() < 0.12) continue;

      groanT -= dt; if (groanT <= 0 && alive > 0) { SFX.groan(); groanT = rand(1.8, 4.5); }
      if (P.hp < 35) { heartT -= dt; if (heartT <= 0) { SFX.heart(); heartT = 0.85; } }
    } else { betweenT -= dt; if (betweenT <= 0) offerUpgrades(); }
    updateZombies(dt); updatePickups(dt);
  }
  updateFx(dt); updateHero(dt); updateCamera(dt);
  if (state === 'play' || state === 'between') updateHUD();
}

// debug / test hook (harmless in normal play)
window.__dr = { tick, get state() { return state; }, get P() { return P; }, get M() { return M; }, get zombies() { return zombies; }, get pickups() { return pickups; }, get score() { return score; }, newGame, keys, setFiring(v) { firing = v; }, pickUpgrade, get upgrades() { return upgrades; } };

showMenu();
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state !== 'paused') tick(dt);
  renderer.render(scene, camera);
});
</script>
